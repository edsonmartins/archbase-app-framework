name: Build and Test

# Não havia workflow de testes: o único build do CI era o de publicação, que roda com
# -DskipTests. Ou seja, nada era verificado automaticamente antes de um artefato ir para o
# Maven Central. Este workflow fecha isso e, principalmente, garante que os testes de
# compatibilidade de banco (Testcontainers) realmente rodem — eles se auto-desabilitam sem
# Docker, então um CI sem container passaria verde sem tê-los executado.

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Um push novo na mesma branch cancela a execução anterior: o runner é self-hosted e
  # compartilhado, e builds enfileirados atrasam todo mundo.
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Pre-cleanup workspace (self-hosted)
        run: |
          cd "${{ github.workspace }}" 2>/dev/null || true
          rm -rf * .[!.]* 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true

      - name: Setup JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Maven
        uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f # v4.5
        with:
          maven-version: '3.9.9'

      # Falha explícita, e não silenciosa. Sem esta etapa, um runner sem Docker faria os testes
      # de container serem PULADOS e o job terminaria verde — exatamente a falsa sensação de
      # cobertura que este workflow existe para evitar.
      - name: Verify Docker is available
        run: |
          set -e
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::Docker não está instalado neste runner. Os testes de compatibilidade"
            echo "::error::de banco (PostgreSQL e MySQL via Testcontainers) precisam dele."
            exit 1
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker está instalado mas o daemon não responde."
            echo "::error::Verifique se o serviço está ativo e se o usuário do runner"
            echo "::error::pertence ao grupo 'docker'."
            exit 1
          fi
          echo "Docker OK:"
          docker version --format '  cliente {{.Client.Version}} / servidor {{.Server.Version}}'

      # O Testcontainers procura o socket em /var/run/docker.sock. Em runner com colima,
      # OrbStack ou Docker rootless o caminho é outro, e sem DOCKER_HOST ele desiste em silêncio.
      - name: Resolve Docker socket for Testcontainers
        run: |
          set -e
          if [ -n "${DOCKER_HOST:-}" ]; then
            echo "DOCKER_HOST já definido no ambiente: $DOCKER_HOST"
            exit 0
          fi
          for sock in \
            /var/run/docker.sock \
            "$HOME/.docker/run/docker.sock" \
            "$HOME/.colima/default/docker.sock" \
            "$HOME/.orbstack/run/docker.sock" \
            "/run/user/$(id -u)/docker.sock"
          do
            if [ -S "$sock" ]; then
              echo "Socket encontrado: $sock"
              echo "DOCKER_HOST=unix://$sock" >> "$GITHUB_ENV"
              # O Ryuk (container que limpa os recursos ao fim) monta o socket pelo caminho
              # padrão; sem este override ele não sobe quando o socket está noutro lugar.
              if [ "$sock" != "/var/run/docker.sock" ]; then
                echo "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock" >> "$GITHUB_ENV"
              fi
              exit 0
            fi
          done
          echo "::error::Nenhum socket Docker encontrado nos caminhos conhecidos."
          echo "::error::Defina DOCKER_HOST no ambiente do runner."
          exit 1

      # Baixa as imagens antes dos testes: o primeiro pull dentro do Testcontainers costuma
      # estourar o timeout de startup em runner com rede lenta, e o erro que aparece é
      # "container did not start", que não diz nada sobre a causa.
      - name: Pre-pull database images
        run: |
          docker pull postgres:16-alpine
          docker pull mysql:8.4

      - name: Build and test
        run: mvn -B clean test

      # Os testes de container são pulados quando o Docker não responde. Se isso acontecer no
      # meio da execução, o build fica verde e a cobertura de portabilidade some sem aviso.
      # Esta etapa transforma "pulado" em falha.
      - name: Ensure database compatibility tests actually ran
        if: always()
        run: |
          set -e
          # Lista literal, sem variável: `for x in $VAR` depende de word-splitting, que nem todo
          # shell faz do mesmo jeito — e a falha seria silenciosa (uma "classe" só, inexistente).
          FALHOU=0
          for classe in \
            PostgresCompatibilidadeTest \
            MySqlCompatibilidadeTest \
            SyncPostgresCompatibilidadeTest \
            SyncMySqlCompatibilidadeTest \
            DdlEntreguePostgresTest \
            DdlEntregueMySqlTest
          do
            arquivo=$(find . -path '*/surefire-reports/TEST-*'"$classe"'.xml' | head -1)
            if [ -z "$arquivo" ]; then
              echo "::error::$classe não produziu relatório — não foi executado."
              FALHOU=1
              continue
            fi
            executados=$(grep -o '<testcase ' "$arquivo" | wc -l | tr -d ' ')
            pulados=$(grep -o '<skipped' "$arquivo" | wc -l | tr -d ' ')
            if [ "$executados" = "0" ] || [ "$executados" = "$pulados" ]; then
              echo "::error::$classe foi PULADO (executados=$executados, pulados=$pulados)."
              echo "::error::Quase sempre significa Docker indisponível para o Testcontainers."
              FALHOU=1
            else
              echo "OK: $classe — $executados teste(s)"
            fi
          done
          exit $FALHOU

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

      - name: Cleanup containers
        if: always()
        run: |
          # Remove containers/redes/volumes órfãos que o Testcontainers possa ter deixado.
          # Sem isto, execuções repetidas no runner self-hosted acumulam e enchem o disco.
          docker container prune -f || true
          docker volume prune -f || true
          docker network prune -f || true
